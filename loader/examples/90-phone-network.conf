# /etc/sysctl.d/90-phone-network.conf: for a phone with USB Ethernet and Wi-Fi
# on the same layer 2 segment. By default Linux answers an ARP request for any
# of its addresses on whichever interface hears it, so Wi-Fi answers for the
# wired address too. After a USB drop the peers then keep the Wi-Fi MAC for
# the wired address. arp_ignore=1 answers only on the interface that holds the
# address; arp_announce=2 uses an address of the outgoing interface as the
# source of ARP requests.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
