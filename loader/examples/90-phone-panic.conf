# /etc/sysctl.d/90-phone-panic.conf: a crashed or hung phone only comes back
# by panicking and rebooting (nothing else resets it; the kexec loader then
# takes over). "-": fine if this kernel lacks the knob (a bootloader kernel
# without the hung task detector).
kernel.panic = 10
kernel.panic_on_oops = 1
# An RCU stall report (21 s) also resets the soft lockup timer, which would
# otherwise only fire ~20 s later.
kernel.panic_on_rcu_stall = 1
# A task stuck in D state for kernel.hung_task_timeout_secs (120 s) panics.
# Network storage (iSCSI, NFS) stalled that long counts too; 0 turns it off.
-kernel.hung_task_panic = 1
