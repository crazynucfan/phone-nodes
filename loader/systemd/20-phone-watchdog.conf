# systemd arms the APSS watchdog (QCOM_WDT, /dev/watchdog0) and pets it while
# it runs: a hung kernel resets into the bootloader, whose kernel runs the
# kexec loader again. KExecWatchdogSec covers the kexec transition itself.
# Harmless where the kernel does not describe the watchdog: systemd just logs
# that it cannot open it. negroni's series leaves the node out (it sends a
# kexec'd kernel to EDL); rhodep's watchdog works.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
KExecWatchdogSec=2min
