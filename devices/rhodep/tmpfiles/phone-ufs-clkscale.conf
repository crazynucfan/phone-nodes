# /etc/tmpfiles.d/phone-ufs-clkscale.conf
# UFS clock scaling off. With it on, ufshcd_clock_scaling_prepare() quiesces
# the tag set and then takes clk_scaling_lock for write, while the RTC update
# work's query holds the read lock and waits on the quiesced queue: all storage
# I/O stops. Seen once on rhodep (2026-10-01); scaling has been off since, so
# this rule has no long soak behind it yet. tmpfiles sets it at every boot, the
# loader kernel's included.
w /sys/bus/platform/devices/4804000.ufshc/clkscale_enable - - - - 0
