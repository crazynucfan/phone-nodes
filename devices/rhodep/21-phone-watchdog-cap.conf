# /etc/systemd/system.conf.d/21-phone-watchdog-cap.conf
# rhodep's APSS watchdog counts to 31 s at most. The 2 min that
# loader/systemd/20-phone-watchdog.conf sets for a reboot and a kexec is
# refused, and the watchdog is then left disarmed: a kexec'd kernel that hangs
# waits for the power button. This drop-in sorts after that file and caps both.
[Manager]
RebootWatchdogSec=30s
KExecWatchdogSec=30s
