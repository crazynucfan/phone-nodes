# /etc/tmpfiles.d/negroni-cpufreq-trans-table.conf
# node_exporter's cpufreq collector reads stats/trans_table for every CPU and
# fails for all of them when one read returns anything but "not found" or
# "permission denied". The prime core's policy has 20 frequencies, so its table
# is over a page and the kernel answers EFBIG: no CPU frequency metrics at all.
# The exporter does not export the table, so take it away from its non-root
# user. Until https://github.com/prometheus/procfs/pull/852 is in the exporter.
z /sys/devices/system/cpu/cpufreq/policy*/stats/trans_table 0400 root root - -
