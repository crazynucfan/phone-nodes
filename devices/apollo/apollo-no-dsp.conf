# /etc/modprobe.d/apollo-no-dsp.conf
# No DSP at all: a node needs none of them (charging, the fuel gauge and USB-C
# are kernel drivers; the modem is an external SDX55), the series' kernels have
# no DSP firmware, and the loader kernel (royka1's, with the firmware built in)
# would start them ~3.5 s into boot. Its sensor DSP then crash-loops, and the
# kexec loader is meant to jump from a kernel with no DSP running.
blacklist qcom_q6v5_pas
install qcom_q6v5_pas /bin/false
