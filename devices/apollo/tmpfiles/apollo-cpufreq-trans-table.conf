# /etc/tmpfiles.d/apollo-cpufreq-trans-table.conf
# node_exporter's cpufreq collector gives up on every CPU when one
# stats/trans_table read fails with anything but "not found" or "permission
# denied". The prime core's policy (policy7) has 20 frequencies, its table is
# over a page, and the kernel answers EFBIG. Take the table away from the
# exporter's (non-root) user at every boot, as on negroni.
z /sys/devices/system/cpu/cpufreq/policy*/stats/trans_table 0400 root root - -
