# /etc/systemd/system.conf.d/21-phone-watchdog-cap.conf
# qcom_wdt starts at a 30 s timeout on apollo. The 2 min that
# loader/systemd/20-phone-watchdog.conf sets for a reboot and a kexec may be
# beyond what it can count (rhodep's stops at 31 s, and refuses 2 min, which
# leaves it disarmed: a kexec'd kernel that hangs then waits for the power
# button). This drop-in sorts after that file and caps both.
[Manager]
RebootWatchdogSec=30s
KExecWatchdogSec=30s
